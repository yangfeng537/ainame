<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 起名平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #f5f7fa 0%, #e8edf3 100%);
      min-height: 100vh; color: #1f2937;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 44px 20px; }
    .logo { font-size: 15px; font-weight: 700; color: #0d9488; letter-spacing: 2px; }
    h1 { font-size: 26px; margin-top: 10px; }
    .sub { color: #6b7280; margin-top: 6px; font-size: 14px; }
    .card {
      background: #fff; border-radius: 14px; box-shadow: 0 6px 24px rgba(31,41,55,.08);
      padding: 24px; margin-top: 22px;
    }
    textarea {
      width: 100%; min-height: 68px; padding: 12px 14px; font-size: 15px; line-height: 1.6;
      border: 1px solid #d1d5db; border-radius: 10px; resize: vertical; outline: none; font-family: inherit;
    }
    textarea:focus { border-color: #0d9488; box-shadow: 0 0 0 3px rgba(13,148,136,.12); }
    .row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; gap: 12px; }
    .model-tag { font-size: 13px; color: #6b7280; }
    .model-tag b { color: #0d9488; }
    button {
      background: #0d9488; color: #fff; border: none; padding: 10px 24px; font-size: 15px;
      border-radius: 10px; cursor: pointer; font-weight: 600; transition: background .2s; white-space: nowrap;
    }
    button:hover { background: #0f766e; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    #status { font-size: 13px; margin-top: 10px; min-height: 18px; color: #0d9488; }
    #status.error { color: #b91c1c; }
    #output {
      margin-top: 14px; white-space: pre-wrap; word-break: break-word; line-height: 1.8; font-size: 15px;
      background: #fafafa; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px;
      min-height: 120px; max-height: 480px; overflow-y: auto;
    }
    #output:empty::before { content: "起名结果会在这里一个字一个字地显示出来……"; color: #9ca3af; }
    .note { color: #b45309; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">AI NAMING</div>
    <h1>AI 起名平台</h1>
    <p class="sub">输入需求，AI 流式生成 3 组名字方案及寓意解释（练习三作业）</p>

    <div class="card">
      <textarea id="requirement" placeholder="例如：男孩、国风、简约；或者：科技公司起名、要国际化、朗朗上口"></textarea>
      <div class="row">
        <span class="model-tag">当前模型：<b>豆包（火山方舟）</b></span>
        <button id="btn">开始起名</button>
      </div>
      <div id="status"></div>
      <div id="output"></div>
    </div>
  </div>

  <script>
    const btn = document.getElementById('btn');
    const input = document.getElementById('requirement');
    const status = document.getElementById('status');
    const output = document.getElementById('output');

    btn.addEventListener('click', start);

    async function start() {
      const requirement = input.value.trim();
      if (!requirement) { status.textContent = '请先输入起名需求'; return; }

      btn.disabled = true;
      status.className = '';
      status.textContent = 'AI 正在起名……';
      output.textContent = '';

      try {
        const res = await fetch('/api/name', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ requirement })
        });

        if (!res.ok || !res.body) {
          const err = await res.json().catch(() => ({}));
          showError('请求失败：' + (err.error || res.status));
          return;
        }

        // 读取 SSE 流：边收边显示
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          // SSE 事件之间以空行分隔，逐条处理
          const parts = buffer.split('\n\n');
          buffer = parts.pop();
          for (const part of parts) handleEvent(part);
        }
        if (buffer.trim()) handleEvent(buffer);

        status.textContent = '生成完成，已写入历史记录';
      } catch (e) {
        showError('网络异常：' + e.message);
      } finally {
        btn.disabled = false;
      }
    }

    function handleEvent(part) {
      let type = 'message';
      const dataLines = [];
      for (const line of part.split('\n')) {
        if (line.startsWith('event: ')) type = line.slice(7).trim();
        else if (line.startsWith('data: ')) dataLines.push(line.slice(6));
      }
      const data = dataLines.join('\n');

      if (type === 'error') { showError(data); return; }
      if (type === 'done') { return; }
      if (type === 'note') { showNote(data); return; }

      // 普通分片格式：{"choices":[{"delta":{"content":"..."}}]}
      try {
        const json = JSON.parse(data);
        const delta = json.choices?.[0]?.delta?.content;
        if (delta) {
          output.textContent += delta;
          output.scrollTop = output.scrollHeight;
        }
      } catch (_) { /* 忽略无法解析的行 */ }
    }

    function showNote(msg) {
      const line = document.createElement('div');
      line.className = 'note';
      line.textContent = parseMessage(msg);
      output.appendChild(line);
    }

    function showError(msg) {
      status.className = 'error';
      status.textContent = parseMessage(msg);
    }

    // data 可能是 JSON 字符串 {"message":"..."}，也可能是纯文本
    function parseMessage(data) {
      try {
        const obj = JSON.parse(data);
        return obj.message || JSON.stringify(obj);
      } catch (_) {
        return data;
      }
    }
  </script>
</body>
</html>
